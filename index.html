<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Location Router</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fff0f0;
            color: #d9534f;
            text-align: center;
        }
        .container { padding: 20px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d9534f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚨 Sending Emergency Location...</h2>
        <div class="spinner"></div>
        <p id="status">Accessing GPS hardware...</p>
    </div>

    <script>
        // ⚠️ ENTER THE EMERGENCY WHATSAPP NUMBER HERE (Include country code, no spaces/symbols)
        const familyPhoneNumber = "923019734476"; 

        // Runs automatically the millisecond the webpage finishes loading
        window.onload = function() {
            if (!navigator.geolocation) {
                document.getElementById('status').textContent = "GPS Not Supported.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    const googleMapsUrl = `https://google.com{lat},${lng}`;
                    const messageText = `🚨 EMERGENCY! Here is my live location: ${googleMapsUrl}`;
                    const encodedMessage = encodeURIComponent(messageText);
                    
                    document.getElementById('status').textContent = "Routing to WhatsApp...";
                    
                    // Instant jump into WhatsApp chat
                    window.location.href = `https://wa.me{familyPhoneNumber}?text=${encodedMessage}`;
                },
                (error) => {
                    document.getElementById('status').textContent = "Error: Please verify phone GPS settings are turned ON.";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 0
                }
            );
        };
    </script>
</body>
</html>
